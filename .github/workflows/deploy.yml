# Deploy pipeline — v2.1
#
# On every push to main:
#   1. test        → 30 unit tests
#   2. security    → Trivy (container/fs) + Checkov (IaC)
#   3. render      → trigger Render deploy hook (secret: RENDER_DEPLOY_HOOK)
#   4. vercel      → trigger Vercel deploy hook (secret: VERCEL_DEPLOY_HOOK)
#   5. gcp         → gcloud run deploy (auto-skips until GCP_SA_KEY exists)
#   6. oracle      → SSH deploy (disabled until you have a VM — see docs)
#
# Render/Vercel deploy hooks are created in each dashboard (Settings → Deploy Hook)
# and added to this repo under Settings → Secrets and variables → Actions.
# They redeploy automatically WITHOUT a paid CI machine — stays ₹0.

name: Deploy to all clouds
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: tests
      - run: npm test
        working-directory: tests

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy — container/app scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: app/
      - name: Checkov — IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/

  deploy-render:
    needs: [test, security-scan]
    # skips silently until the deploy-hook secret exists
    if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -o /dev/null -w "render deploy hook → HTTP %{http_code}\n"

  deploy-vercel:
    needs: [test, security-scan]
    if: ${{ secrets.VERCEL_DEPLOY_HOOK != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy
        run: |
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" \
            -o /dev/null -w "vercel deploy hook → HTTP %{http_code}\n"

  deploy-gcp:
    needs: [test, security-scan]
    # Auto-skips until you add the GCP_SA_KEY secret (keeps the Actions tab green).
    if: ${{ secrets.GCP_SA_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run
        run: |
          cd app
          gcloud run deploy aegis-app-gcp \
            --source . \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars CLOUD_NAME=google-cloud-run

  # Oracle deploy example — enable when you have a VM + SSH key secret.
  deploy-oracle:
    needs: [test, security-scan]
    if: false   # set to true once ORACLE_VM_IP + ORACLE_SSH_KEY exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_VM_IP }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/aegis-platform && git pull
            cd app && sudo docker build -t aegis-app .
            sudo docker rm -f aegis-app || true
            sudo docker run -d -p 80:3000 -e CLOUD_NAME=oracle-cloud --name aegis-app --restart unless-stopped aegis-app

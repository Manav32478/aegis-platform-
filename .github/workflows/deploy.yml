name: Deploy to all clouds

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
        working-directory: tests
      - run: npm test -- --runInBand
        working-directory: tests

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/
          output_format: cli
          soft_fail: false

  deploy-render:
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook if configured
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not configured; skipping Render deploy."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"

  deploy-vercel:
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook if configured
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK is not configured; skipping Vercel deploy."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"

  deploy-gcp:
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    steps:
      - id: gate
        name: Check whether GCP credentials are configured
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GCP_SA_KEY is not configured; skipping Cloud Run deploy."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.configured == 'true'
      - uses: google-github-actions/auth@v2
        if: steps.gate.outputs.configured == 'true'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.gate.outputs.configured == 'true'
      - name: Deploy to Cloud Run
        if: steps.gate.outputs.configured == 'true'
        run: |
          cd app
          gcloud run deploy aegis-app-gcp \
            --source . \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars CLOUD_NAME=google-cloud-run

  # Enable this job only after provisioning an Oracle VM and adding SSH secrets.
  deploy-oracle:
    if: false
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_VM_IP }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/aegis-platform && git pull
            cd app && sudo docker build -t aegis-app .
            sudo docker rm -f aegis-app || true
            sudo docker run -d -p 80:3000 -e CLOUD_NAME=oracle-cloud --name aegis-app --restart unless-stopped aegis-app

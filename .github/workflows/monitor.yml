# Health monitor — runs every 5 minutes from GitHub's global runners.
# NOTE ON FREE TIER: a */5 cron on a PRIVATE repo can exceed GitHub's free
# 2,000 Actions minutes/month. Either keep the repo PUBLIC (unlimited free
# minutes) or rely on the Cloudflare Worker cron (orchestration/router/).
name: Health monitor
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node monitor.js
        working-directory: orchestration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MONITOR_REGION: github-actions
          TARGETS: ${{ secrets.TARGETS }}
          # self-healing (Month 3.5) — a PAT with workflow scope
          GITHUB_TOKEN: ${{ secrets.SELF_HEAL_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          # alerting (optional — leave blank to log only)
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}

  report:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node report.js
        working-directory: orchestration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          REPORT_PERIOD: daily
          REPORT_WEBHOOK_URL: ${{ secrets.REPORT_WEBHOOK_URL }}
